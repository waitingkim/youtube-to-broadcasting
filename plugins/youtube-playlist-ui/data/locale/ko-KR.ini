MyPlaylists.ConfigureHelp="<b>본인 OAuth 클라이언트 만들기(최초 1회):</b><ol><li><a href='https://console.cloud.google.com/'>Google Cloud Console</a>에서 프로젝트를 만듭니다.</li><li>API 및 서비스 → 라이브러리 → <b>YouTube Data API v3</b> 사용 설정.</li><li>OAuth 동의 화면 → 외부 → 본인 Google 계정을 <b>테스트 사용자</b>로 추가.</li><li>사용자 인증 정보 → 사용자 인증 정보 만들기 → OAuth 클라이언트 ID → 애플리케이션 유형 <b>데스크톱 앱</b>.</li><li>클라이언트 ID와 보안 비밀번호를 여기에 붙여 넣습니다.</li></ol>읽기 전용 권한(youtube.readonly)만 요청하며, 인증 정보는 이 컴퓨터에만 저장됩니다."

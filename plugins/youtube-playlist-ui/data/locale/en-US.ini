MyPlaylists.ConfigureHelp="<b>Create your own OAuth client (once):</b><ol><li>Open <a href='https://console.cloud.google.com/'>Google Cloud Console</a> and create a project.</li><li>APIs &amp; Services → Library → enable <b>YouTube Data API v3</b>.</li><li>OAuth consent screen → External → add your Google account as a <b>test user</b>.</li><li>Credentials → Create credentials → OAuth client ID → Application type <b>Desktop app</b>.</li><li>Copy the client ID and client secret here.</li></ol>Access is read-only (youtube.readonly). Credentials are stored only on this computer."
